<title>org mark · round 1 评审</title>
<style>
  :root{
    --bg:#F3EDE3; --card:#FCF8F1; --line:#E2D8C8;
    --ink:#191713; --dim:#7A7166; --clay:#D87857; --clay-deep:#B4532A;
    --stage:#191713; --keep:#2E7D4F; --maybe:#B08A2E; --drop:#A94436;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0;color:var(--ink);font:15px/1.6 -apple-system,"Helvetica Neue","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 140px;}
  header{border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:26px;}
  .eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.16em;color:var(--clay-deep);text-transform:uppercase;}
  h1{font-size:34px;margin:8px 0 8px;font-weight:800;letter-spacing:-.01em;text-wrap:balance;}
  header p{color:var(--dim);max-width:72ch;margin:0 0 14px;}
  .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .who label{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.1em;color:var(--dim);}
  .who input{font:inherit;padding:7px 12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);width:180px;}
  .pill{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim);}
  .pill.ok{border-color:var(--keep);color:var(--keep);}
  .pill.bad{border-color:var(--drop);color:var(--drop);}
  .tabs{display:flex;gap:8px;margin:18px 0 22px;}
  .tabs button{font:inherit;font-weight:600;padding:8px 18px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);cursor:pointer;}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--card);}
  .tabs button:focus-visible,.vbtns button:focus-visible,.bar button:focus-visible,#copyAgg:focus-visible{outline:3px solid var(--clay);outline-offset:2px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
  .stage{background:var(--stage);height:190px;display:flex;align-items:center;justify-content:center;}
  .stage svg{width:130px;height:130px;}
  .stage.wide svg{width:210px;height:100px;}
  .stage img{max-width:100%;max-height:100%;object-fit:contain;}
  .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex-grow:1;}
  .cid{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;background:var(--ink);color:var(--card);padding:2px 7px;border-radius:4px;align-self:flex-start;}
  .concept{font-size:13px;color:var(--ink);line-height:1.45;}
  .vbtns{display:flex;gap:6px;}
  .vbtns button{flex:1;font:inherit;font-size:12.5px;font-weight:600;padding:6px 0;border-radius:6px;border:1.5px solid var(--line);background:transparent;cursor:pointer;color:var(--dim);}
  .vbtns button[data-v="keep"].on{background:var(--keep);border-color:var(--keep);color:#fff;}
  .vbtns button[data-v="maybe"].on{background:var(--maybe);border-color:var(--maybe);color:#fff;}
  .vbtns button[data-v="drop"].on{background:var(--drop);border-color:var(--drop);color:#fff;}
  .note{font:13px/1.5 inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;resize:vertical;min-height:34px;}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--card);padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:5;}
  .bar .counts{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;display:flex;gap:10px;}
  .bar .counts b{font-weight:700;}
  .bar input{font:inherit;font-size:13px;flex:1;min-width:200px;padding:8px 12px;border-radius:6px;border:none;background:#2A251E;color:var(--card);}
  .bar button{font:inherit;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:7px;border:none;cursor:pointer;}
  #submitBtn{background:var(--clay);color:#fff;}
  #exportBtn{background:transparent;color:var(--card);border:1.5px solid #4A443B;}
  .k-keep{color:#6FCF97;} .k-maybe{color:#E2C044;} .k-drop{color:#EB8373;}
  /* aggregate view */
  #aggView{display:none;}
  .agg-head{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  #copyAgg{font:inherit;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:7px;border:none;background:var(--clay);color:#fff;cursor:pointer;}
  .agg-sub{color:var(--dim);font-size:13.5px;}
  table.agg{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.agg th,table.agg td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.agg th{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  table.agg td.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Menlo,monospace;}
  .aggwrap{overflow-x:auto;}
  .mini{width:44px;height:44px;background:var(--stage);border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .mini svg{width:32px;height:32px;} .mini img{max-width:38px;max-height:38px;}
  .notecell{color:var(--dim);font-size:12.5px;max-width:34ch;}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 20px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;}
  .toast.show{opacity:1;}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none;} }
  textarea#aggJson{width:100%;min-height:140px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:14px;background:#fff;}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">org mark · round 1 · 24 candidates</div>
    <h1>Org 标志 Round 1 评审板</h1>
    <p>__GOAL__</p>
    <div class="who">
      <label for="name">你的名字</label>
      <input id="name" placeholder="必填,提交用" maxlength="24" autocomplete="off">
      <span id="storagePill" class="pill">连接中…</span>
      <select id="roundNav" class="pill" style="display:none;cursor:pointer;font:inherit;font-size:12.5px" aria-label="round history"></select>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button id="tabReview" role="tab" aria-selected="true">评审</button>
    <button id="tabAgg" role="tab" aria-selected="false">汇总(所有人)</button>
  </div>

  <div id="reviewView"><div class="grid" id="grid"></div></div>

  <div id="aggView">
    <div class="agg-head">
      <button id="copyAgg">复制汇总 JSON → 发给 Claude</button>
      <span class="agg-sub" id="aggStatus">尚未加载。</span>
    </div>
    <div class="aggwrap"><table class="agg" id="aggTable"></table></div>
    <textarea id="aggJson" readonly aria-label="汇总 JSON(备用手动复制)"></textarea>
  </div>
</div>

<div class="bar">
  <div class="counts">
    <span class="k-keep">keep <b id="cKeep">0</b></span>
    <span class="k-maybe">maybe <b id="cMaybe">0</b></span>
    <span class="k-drop">drop <b id="cDrop">0</b></span>
  </div>
  <input id="nextDir" placeholder="next round → 下一轮方向建议(可空)">
  <button id="submitBtn">提交我的裁决</button>
  <button id="exportBtn">导出我的 JSON</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const ITEMS = __ITEMS_JSON__;
const ROUND = 1;
const state = { verdicts: {}, notes: {} };

const $ = (id) => document.getElementById(id);

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2600); }

function stageHTML(it){
  if (it.svg) return it.svg;
  return '<img src="' + it.jpg + '" alt="' + it.concept + '">';
}

function render(){
  const g = $("grid");
  g.innerHTML = "";
  for (const it of ITEMS){
    const card = document.createElement("div");
    card.className = "card";
    const wide = it.id === "r1-p10" ? " wide" : "";
    card.innerHTML =
      '<div class="stage'+wide+'">' + stageHTML(it) + '</div>' +
      '<div class="meta">' +
        '<span class="cid">' + it.id + '</span>' +
        '<span class="concept">' + it.concept + '</span>' +
        '<div class="vbtns" data-id="' + it.id + '">' +
          '<button data-v="keep">keep</button><button data-v="maybe">maybe</button><button data-v="drop">drop</button>' +
        '</div>' +
        '<textarea class="note" data-id="' + it.id + '" placeholder="note / 意见…"></textarea>' +
      '</div>';
    g.appendChild(card);
  }
  g.addEventListener("click", (e)=>{
    const b = e.target.closest("button[data-v]"); if (!b) return;
    const id = b.parentElement.dataset.id, v = b.dataset.v;
    state.verdicts[id] = (state.verdicts[id] === v) ? null : v;
    syncButtons(); saveDraft();
  });
  g.addEventListener("input", (e)=>{
    const n = e.target.closest("textarea.note"); if (!n) return;
    state.notes[n.dataset.id] = n.value; saveDraftDebounced();
  });
}

function syncButtons(){
  document.querySelectorAll(".vbtns").forEach(w=>{
    const v = state.verdicts[w.dataset.id];
    w.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v === v));
  });
  let k=0,m=0,d=0;
  for (const v of Object.values(state.verdicts)){ if(v==="keep")k++; else if(v==="maybe")m++; else if(v==="drop")d++; }
  $("cKeep").textContent=k; $("cMaybe").textContent=m; $("cDrop").textContent=d;
}

function payload(){
  const name = $("name").value.trim();
  return {
    round: ROUND, name, ts: new Date().toISOString(),
    next: $("nextDir").value.trim(),
    decisions: ITEMS.map(it=>({ id: it.id, verdict: state.verdicts[it.id] || null, note: (state.notes[it.id]||"").trim() }))
      .filter(x=>x.verdict || x.note)
  };
}

/* ---- share-server transport (same-origin) ---- */
const SHARE = location.pathname.replace(/\/$/, "");
const LS_KEY = "bs-draft:" + SHARE;

function saveDraft(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({verdicts:state.verdicts, notes:state.notes, name:$("name").value, next:$("nextDir").value})); } catch(e){}
}
let draftTimer=null;
function saveDraftDebounced(){ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft, 500); }

function loadDraft(){
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (!d) return;
    Object.assign(state.verdicts, d.verdicts||{}); Object.assign(state.notes, d.notes||{});
    if (d.name) $("name").value = d.name;
    if (d.next) $("nextDir").value = d.next;
    document.querySelectorAll("textarea.note").forEach(n=>{ n.value = state.notes[n.dataset.id]||""; });
    syncButtons();
  } catch(e){}
}

async function submit(){
  const p = payload();
  if (!p.name){ toast("先填名字再提交"); $("name").focus(); return; }
  if (!p.decisions.length){ toast("一个都没标,先点几个 keep/maybe/drop"); return; }
  try {
    const res = await fetch(SHARE + "/verdict", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(p) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    toast("已提交 ✓ (" + p.decisions.length + " 条) — 所有打开这个链接的人都能在汇总里看到");
  } catch(e){ exportMine(); toast("提交失败(" + e.message + "),已改为导出 JSON"); }
}

function exportMine(){
  const txt = JSON.stringify(payload(), null, 1);
  copyText(txt, "已复制我的裁决 JSON");
}

function copyText(txt, okMsg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(okMsg), ()=>{ $("aggJson").value = txt; showAgg(); toast("剪贴板不可用,JSON 已放到汇总页文本框"); });
  } else { $("aggJson").value = txt; showAgg(); toast("剪贴板不可用,JSON 已放到汇总页文本框"); }
}

/* ---- aggregate view ---- */
function showAgg(){ $("aggView").style.display="block"; $("reviewView").style.display="none";
  $("tabAgg").setAttribute("aria-selected","true"); $("tabReview").setAttribute("aria-selected","false"); }
function showReview(){ $("aggView").style.display="none"; $("reviewView").style.display="block";
  $("tabAgg").setAttribute("aria-selected","false"); $("tabReview").setAttribute("aria-selected","true"); }

async function loadAgg(){
  let subs = [];
  try {
    const res = await fetch(SHARE + "/verdicts");
    subs = (await res.json()).submissions || [];
  } catch(e){ $("aggStatus").textContent = "读取失败:" + e.message; return []; }
  $("aggStatus").textContent = subs.length + " 人已提交:" + subs.map(s=>s.name).join("、");
  renderAggTable(subs);
  return subs;
}

function renderAggTable(subs){
  const t = $("aggTable");
  const rows = ITEMS.map(it=>{
    let k=0,m=0,d=0; const notes=[];
    for (const s of subs){
      const dec = (s.decisions||[]).find(x=>x.id===it.id);
      if (!dec) continue;
      if (dec.verdict==="keep")k++; else if(dec.verdict==="maybe")m++; else if(dec.verdict==="drop")d++;
      if (dec.note) notes.push(s.name+": "+dec.note);
    }
    return {it,k,m,d,notes,score:k*2+m-d*2};
  }).sort((a,b)=>b.score-a.score);
  t.innerHTML = "<tr><th></th><th>id</th><th>concept</th><th>keep</th><th>maybe</th><th>drop</th><th>notes</th></tr>" +
    rows.map(r=>"<tr><td><div class='mini'>"+stageHTML(r.it)+"</div></td>"+
      "<td class='mono'>"+r.it.id+"</td><td>"+r.it.concept+"</td>"+
      "<td class='num k-keep'>"+r.k+"</td><td class='num k-maybe'>"+r.m+"</td><td class='num k-drop'>"+r.d+"</td>"+
      "<td class='notecell'>"+r.notes.map(n=>n.replace(/</g,"&lt;")).join("<br>")+"</td></tr>").join("");
}

async function copyAgg(){
  const subs = await loadAgg();
  if (!subs.length){ toast("还没有任何提交"); return; }
  const out = { round: ROUND, kind: "org-logo-round-review-aggregate", exported: new Date().toISOString(), submissions: subs };
  const txt = JSON.stringify(out, null, 1);
  $("aggJson").value = txt;
  copyText(txt, "汇总 JSON 已复制 — 粘贴给 Claude 即可");
}

/* ---- boot ---- */
render(); syncButtons();
$("submitBtn").addEventListener("click", submit);
$("exportBtn").addEventListener("click", exportMine);
$("tabReview").addEventListener("click", showReview);
$("tabAgg").addEventListener("click", ()=>{ showAgg(); loadAgg(); });
$("copyAgg").addEventListener("click", copyAgg);
$("name").addEventListener("change", saveDraft);
$("nextDir").addEventListener("change", saveDraft);
const pill = $("storagePill");
pill.textContent = "share server ✓ 多人可提交"; pill.classList.add("ok");
loadDraft();

/* round switcher — series index lives outside any single round view */
const SERIES = new URLSearchParams(location.search).get("series");
if (SERIES && /^[\w-]{1,64}$/.test(SERIES)) {
  fetch("/s/" + SERIES + "/index.json").then(r=>r.json()).then(d=>{
    const rounds = d.rounds || [];
    if (rounds.length < 1) return;
    const nav = $("roundNav");
    const cur = location.pathname.split("/").pop();
    nav.innerHTML = [...rounds].reverse().map(e=>
      '<option value="' + e.id + '"' + (e.id===cur?" selected":"") + ">round " + e.round + (e.title? " · " + e.title : "") + "</option>"
    ).join("") + '<option value="__all__">全部 rounds…</option>';
    nav.style.display = "inline-block";
    nav.addEventListener("change", ()=>{
      if (nav.value === "__all__") location.href = "/s/" + SERIES;
      else location.href = "/share/" + nav.value + "?series=" + SERIES;
    });
  }).catch(()=>{});
}
</script>
